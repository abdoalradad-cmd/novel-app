name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add native code (PDF printing + text-to-speech)
        run: |
          mkdir -p android/app/src/main/java/com/alradad/novels
          cp native/AppNativePlugin.java native/MainActivity.java android/app/src/main/java/com/alradad/novels/
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "TTS_SERVICE" android/app/src/main/AndroidManifest.xml
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.webkit:webkit:1.12.1"/' android/app/build.gradle
          grep -n "androidx.webkit" android/app/build.gradle

      - name: Add phone push notifications (Firebase)
        run: |
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation platform("com.google.firebase:firebase-bom:33.7.0")\n    implementation "com.google.firebase:firebase-messaging"/' android/app/build.gradle
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_radpad" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@android:color/holo_green_dark" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp native/ic_stat_radpad.xml android/app/src/main/res/drawable/
          if [ -f native/google-services.json ]; then
            cp native/google-services.json android/app/google-services.json
            grep -q "com.google.gms:google-services" android/build.gradle || sed -i "0,/classpath 'com.android.tools.build:gradle/s//classpath 'com.google.gms:google-services:4.4.2'\n        classpath 'com.android.tools.build:gradle/" android/build.gradle
            grep -q "apply plugin: 'com.google.gms.google-services'" android/app/build.gradle || echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            echo "Firebase ENABLED"
          else
            echo "Firebase file not found: phone push is OFF (app still builds normally)"
          fi

      - name: Set app version and stable signing key
        run: |
          V=$(tr -d '[:space:]' < APP_VERSION)
          sed -i "s/versionName \".*\"/versionName \"$V\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          mkdir -p ~/.android
          cp native/radpad-debug.keystore ~/.android/debug.keystore
          # توقيع صريح بالمفتاح الثابت (مش بنعتمد على مكان debug.keystore التلقائي)
          cp native/radpad-debug.keystore android/app/radpad.keystore
          keytool -list -keystore android/app/radpad.keystore -storepass android | grep -iE "androiddebugkey|fingerprint" || { echo "::error::ملف native/radpad-debug.keystore مش سليم أو مش موجود في المستودع"; exit 1; }
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  radpad {
                      storeFile file('radpad.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.radpad }
              }
          }
          EOF

      - name: Generate icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify signing key (must be the stable RadPad key)
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee cert.txt
          if ! grep -qi "ad26fc5fd4625508fa5feb06b6220af270bf25884f38cdad1cc34cb41186994f" cert.txt; then
            echo "::error::الـ APK اتوقّع بمفتاح غير مفتاح RadPad الثابت — التحديث مش هيتثبّت فوق القديم"; exit 1
          fi
          echo "OK: signed with the stable RadPad key"

      - name: Name the APK (RadPad)
        run: |
          V=$(tr -d '[:space:]' < APP_VERSION)
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/RadPad-v${V}-${{ github.run_number }}.apk"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadPad
          path: out/*.apk

      - name: Publish direct download (Releases, no zip)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < APP_VERSION)
          F=$(ls out/*.apk | head -1)
          gh release create "build-${{ github.run_number }}" "$F" --target "${{ github.sha }}" --title "RadPad v${V} (build ${{ github.run_number }})" --notes "حمّل ملف الـ APK مباشرة وثبّته." --latest
