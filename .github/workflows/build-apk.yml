name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add native code (PDF printing + text-to-speech)
        run: |
          mkdir -p android/app/src/main/java/com/alradad/novels
          cp native/AppNativePlugin.java native/MainActivity.java android/app/src/main/java/com/alradad/novels/
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "TTS_SERVICE" android/app/src/main/AndroidManifest.xml
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.webkit:webkit:1.12.1"/' android/app/build.gradle
          grep -n "androidx.webkit" android/app/build.gradle

      - name: Generate icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alradad-novels-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
